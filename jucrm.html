<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ju.CRM — Gestão de vendas para imobiliárias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0a1a5c;        /* azul-marinho da marca */
  --navy-deep:#071345;   /* mais escuro p/ menu */
  --cyan:#16c5d4;        /* ciano de destaque */
  --cyan-dark:#0ea5b5;
  --magenta:#c026d3;     /* acento */
  --ink:#0f1830;
  --muted:#6b7280;
  --line:#e6e8f0;
  --bg:#f4f6fb;
  --card:#ffffff;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.font-display{font-family:'Sora',sans-serif;}

/* ===== LOGIN ===== */
#loginScreen{display:flex;min-height:100vh;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, rgba(22,197,212,.18), transparent 45%),
  radial-gradient(circle at 80% 80%, rgba(192,38,211,.14), transparent 45%),
  var(--navy);position:relative;overflow:hidden;}
.login-card{background:#fff;border-radius:20px;padding:40px 36px;width:380px;max-width:92vw;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative;z-index:2;}
.login-logo{height:46px;display:block;margin:0 auto 6px;}
.login-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:26px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;}
.login-field input:focus{border-color:var(--cyan);}
.login-btn{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--navy),#13277e);color:#fff;font-size:14px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;margin-top:6px;transition:transform .1s,box-shadow .2s;box-shadow:0 8px 22px rgba(10,26,92,.35);}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(10,26,92,.45);}
.login-err{display:none;color:var(--bad);font-size:12px;text-align:center;margin-top:12px;}
.login-foot{text-align:center;margin-top:22px;font-size:11px;color:#aab;}

/* ===== APP SHELL ===== */
#appScreen{display:none;width:100vw;height:100vh;overflow:hidden;}
.sidebar{width:248px;flex-shrink:0;background:var(--navy-deep);height:100vh;display:flex;flex-direction:column;overflow-y:auto;}
.sb-logo{padding:22px 22px 16px;}
.sb-logo img{height:30px;}
.sb-section{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.32);padding:16px 22px 7px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 22px;color:rgba(255,255,255,.74);cursor:pointer;font-size:13.5px;font-weight:500;border-left:3px solid transparent;transition:background .14s,color .14s;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,rgba(22,197,212,.16),transparent);color:#fff;border-left-color:var(--cyan);}
.nav-item.active svg{opacity:1;color:var(--cyan);}
.nav-badge{margin-left:auto;background:var(--cyan);color:var(--navy-deep);font-size:10px;font-weight:800;padding:1px 7px;border-radius:9px;font-family:'Sora',sans-serif;}
.nav-badge.novo{background:var(--magenta);color:#fff;}
.sb-foot{margin-top:auto;padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);}
.sb-foot .nav-item{padding:9px 0;border:none;}

.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{height:62px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:18px;}
.tb-module{display:flex;align-items:center;gap:8px;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:var(--navy);}
.tb-module .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(22,163,74,.6);}
.tb-spacer{flex:1;}
.tb-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;position:relative;}
.tb-icon:hover{background:var(--bg);}
.tb-user{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line);cursor:pointer;}
.tb-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Sora',sans-serif;font-size:14px;}
.tb-uname{font-size:13px;font-weight:700;line-height:1.1;}
.tb-urole{font-size:11px;color:var(--muted);}

.content{flex:1;overflow-y:auto;padding:26px;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.3px;}
.page-sub{font-size:13px;color:var(--muted);margin-top:3px;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .1s,box-shadow .2s,background .15s;}
.btn-primary{background:linear-gradient(135deg,var(--navy),#13277e);color:#fff;box-shadow:0 6px 16px rgba(10,26,92,.28);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-cyan{background:var(--cyan);color:var(--navy-deep);}
.btn-cyan:hover{background:var(--cyan-dark);color:#fff;}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{background:var(--bg);}

/* coming soon */
.coming{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;text-align:center;color:var(--muted);}
.coming .ico{width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,rgba(22,197,212,.15),rgba(10,26,92,.1));display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.coming h2{font-size:19px;color:var(--ink);margin-bottom:8px;}
.coming p{font-size:13.5px;max-width:380px;line-height:1.55;}
.coming .tag{margin-top:16px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--cyan-dark);background:rgba(22,197,212,.12);padding:5px 12px;border-radius:20px;}

/* cards / metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px;}
.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;}
.metric .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;}
.metric .value{font-size:30px;font-weight:800;font-family:'Sora',sans-serif;margin-top:6px;color:var(--ink);}
.metric .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.metric .ico{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.metric .bar{height:3px;border-radius:3px;margin-top:14px;background:var(--line);overflow:hidden;}
.metric .bar i{display:block;height:100%;border-radius:3px;}

.section-title{font-size:15px;font-weight:700;font-family:'Sora',sans-serif;color:var(--ink);margin:6px 0 14px;}

/* ===== FUNIL / KANBAN ===== */
.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;}
.kcol{flex:0 0 290px;background:#eef1f8;border-radius:14px;padding:12px;max-height:calc(100vh - 230px);display:flex;flex-direction:column;}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;}
.kcol-head .ttl{font-size:13px;font-weight:700;font-family:'Sora',sans-serif;color:var(--ink);display:flex;align-items:center;gap:8px;}
.kcol-head .ttl .pip{width:9px;height:9px;border-radius:50%;}
.kcol-head .cnt{font-size:11px;font-weight:700;color:var(--muted);background:#fff;border-radius:8px;padding:2px 9px;}
.kcol-val{font-size:11px;color:var(--cyan-dark);font-weight:700;padding:0 6px 10px;}
.kcards{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:2px;}
.kcard{background:#fff;border-radius:12px;padding:13px;border:1px solid var(--line);cursor:grab;transition:box-shadow .15s,transform .1s;border-left:3px solid var(--cyan);}
.kcard:hover{box-shadow:0 8px 22px rgba(10,26,92,.12);transform:translateY(-1px);}
.kcard.dragging{opacity:.5;}
.kcard .nome{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:7px;}
.kcard .row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.kcard .row svg{width:12px;height:12px;flex-shrink:0;}
.kcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.kcard .temp{font-size:10px;font-weight:700;padding:2px 8px;border-radius:7px;}
.temp-frio{background:rgba(37,99,235,.1);color:#2563eb;}
.temp-morno{background:rgba(217,119,6,.12);color:var(--warn);}
.temp-quente{background:rgba(220,38,38,.1);color:var(--bad);}
.kcard .crt{font-size:10.5px;color:var(--cyan-dark);font-weight:600;}
.kcol.drop-hover{outline:2px dashed var(--cyan);outline-offset:-4px;}

/* tabela leads */
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:13px 16px;border-bottom:1px solid var(--line);background:#fafbfe;}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:#fafbff;cursor:pointer;}
.badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:8px;display:inline-block;}
.b-novo{background:rgba(22,197,212,.13);color:var(--cyan-dark);}
.b-atend{background:rgba(217,119,6,.12);color:var(--warn);}
.b-fechado{background:rgba(22,163,74,.12);color:var(--ok);}
.b-perdido{background:rgba(220,38,38,.1);color:var(--bad);}
.lead-av{width:30px;height:30px;border-radius:8px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Sora',sans-serif;}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;font-family:'Inter',sans-serif;outline:none;background:#fff;}
.filters input{flex:1;min-width:200px;}
.filters input:focus,.filters select:focus{border-color:var(--cyan);}

@media(max-width:760px){
  .sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:none;}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <img class="login-logo" id="loginLogo" alt="Ju.CRM"/>
    <div class="login-sub">Gestão de vendas para imobiliárias</div>
    <div class="login-field">
      <label>E-mail</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="username"/>
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr">E-mail ou senha incorretos.</div>
    <div class="login-foot">Ju.CRM · módulo do ecossistema Julia</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appScreen">
  <!-- SIDEBAR -->

      Dashboard
    </div>
    <div class="nav-item" id="navFunil" onclick="nav('funil')">

    <div class="nav-item" id="navLeads" onclick="nav('leads')">

      Leads
    </div>

    <div class="sb-section">Operação</div>
    <div class="nav-item" id="navDist" onclick="nav('distribuicao')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Distribuição
    </div>
    <div class="nav-item" id="navCorretores" onclick="nav('corretores')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 .01M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>

    </div>
    <div class="nav-item" id="navImoveis" onclick="nav('imoveis')">

    <div class="sb-section">Análise</div>
    <div class="nav-item" id="navRelatorios" onclick="nav('relatorios')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 16l4-4 3 3 5-6"/></svg>
      Relatórios
    </div>

      Configurações

    <div class="sb-foot">
      <div class="nav-item" onclick="doLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sair
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-module"><span class="dot"></span> Imobiliária Modelo</div>
      <div class="tb-spacer"></div>
      <div class="tb-icon" title="Notificações">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="tb-user">
        <div class="tb-avatar" id="tbAvatar">J</div>
        <div>
          <div class="tb-uname" id="tbName">Jadson</div>
          <div class="tb-urole">Administrador</div>
        </div>
      </div>
    </div>

    <div class="content" id="content"><!-- páginas entram aqui --></div>
  </div>
</div>

function doLogin(){
  const e=document.getElementById('loginEmail').value.trim();
  const p=document.getElementById('loginPassword').value;
  if(e===LOGIN_EMAIL&&p===LOGIN_PASS){
    document.getElementById('loginErr').style.display='none';
    try{localStorage.setItem('sessao_jucrm',JSON.stringify({em:Date.now()}));}catch(_){}
    entrarNoApp();
  }else{document.getElementById('loginErr').style.display='block';}
}
function entrarNoApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='flex';
  nav('dashboard');
}
function doLogout(){
  try{localStorage.removeItem('sessao_jucrm');}catch(_){}
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
function checarSessao(){
  try{const s=JSON.parse(localStorage.getItem('sessao_jucrm')||'null');
    if(s&&s.em&&(Date.now()-s.em)<7*24*60*60*1000){entrarNoApp();}
  }catch(_){}
}

let dragId=null;
function renderFunil(){
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="page-head">
      <div><div class="page-title">Funil</div><div class="page-sub">Arraste os cards entre as etapas para mover o lead</div></div>
      <button class="btn btn-ghost" onclick="nav('leads')">Ver como lista</button>
    </div>
    <div class="kanban" id="kanban">
      ${ETAPAS.map(e=>{
        const cards=LEADS.filter(l=>l.etapa===e.id);
        const val=cards.reduce((s,l)=>s+l.valor,0);
        return `<div class="kcol" data-etapa="${e.id}" ondragover="kanbanOver(event,this)" ondragleave="this.classList.remove('drop-hover')" ondrop="kanbanDrop(event,'${e.id}')">
          <div class="kcol-head"><div class="ttl"><span class="pip" style="background:${e.cor}"></span>${e.nome}</div><span class="cnt">${cards.length}</span></div>
          ${val?`<div class="kcol-val">R$ ${val.toLocaleString('pt-BR')}</div>`:'<div class="kcol-val">&nbsp;</div>'}
          <div class="kcards">
            ${cards.map(l=>kcard(l)).join('')||'<div style="font-size:11.5px;color:#aab;text-align:center;padding:18px 0;">Sem leads</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
function kcard(l){
  return `<div class="kcard" draggable="true" data-id="${l.id}" ondragstart="dragId=${l.id};this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="abrirLead(${l.id})">
    <div class="nome">${escHtml(l.nome)}</div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 5.55 5.55l.96-.96a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${escHtml(l.tel)}</div>
    <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>${escHtml(l.corretor)}</div>
    <div class="foot"><span class="temp temp-${l.temp}">${l.temp}</span><span class="crt">${escHtml(l.ultima)}</span></div>
  </div>`;
}
function kanbanOver(e,col){e.preventDefault();col.classList.add('drop-hover');}
function kanbanDrop(e,etapa){
  e.preventDefault();
  document.querySelectorAll('.kcol').forEach(k=>k.classList.remove('drop-hover'));
  const l=LEADS.find(x=>x.id===dragId);
  if(l){l.etapa=etapa;renderFunil();}
  dragId=null;
}

let leadsFiltro={q:'',etapa:''};
function renderLeads(){
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="page-head">
      <div><div class="page-title">Leads</div><div class="page-sub">Todos os leads do CRM</div></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" onclick="nav('funil')">Ver funil</button>
        <button class="btn btn-primary">+ Novo lead</button>
      </div>
    </div>
    <div class="filters">
      <input id="lq" placeholder="Buscar por nome ou telefone..." oninput="leadsFiltro.q=this.value;pintarLeads()"/>
      <select id="le" onchange="leadsFiltro.etapa=this.value;pintarLeads()">
        <option value="">Todas as etapas</option>
        ${ETAPAS.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')}
      </select>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Cliente</th><th>Contato</th><th>Origem</th><th>Corretor</th><th>Etapa</th><th>Valor</th><th>Último contato</th></tr></thead>
      <tbody id="leadsBody"></tbody>
    </table></div>`;
  pintarLeads();
}
function pintarLeads(){
  const body=document.getElementById('leadsBody');if(!body)return;
  const q=leadsFiltro.q.toLowerCase();
  const filtrados=LEADS.filter(l=>(!q||l.nome.toLowerCase().includes(q)||l.tel.includes(q))&&(!leadsFiltro.etapa||l.etapa===leadsFiltro.etapa));
  if(!filtrados.length){body.innerHTML='<tr><td colspan="7" style="text-align:center;color:#aab;padding:30px">Nenhum lead encontrado.</td></tr>';return;}
  const nomeEtapa=id=>(ETAPAS.find(e=>e.id===id)||{}).nome||id;
  const cls=id=>id==='novo'?'b-novo':id==='vendido'?'b-fechado':id==='aprovado'?'b-fechado':'b-atend';
  body.innerHTML=filtrados.map(l=>`
    <tr onclick="abrirLead(${l.id})">
      <td><div style="display:flex;align-items:center;gap:9px"><span class="lead-av" style="background:${avColor(l.nome)}">${initials(l.nome)}</span><b style="font-size:13px">${escHtml(l.nome)}</b></div></td>
      <td>${escHtml(l.tel)}</td>
      <td>${escHtml(l.origem)}</td>
      <td>${escHtml(l.corretor)}</td>
      <td><span class="badge ${cls(l.etapa)}">${nomeEtapa(l.etapa)}</span></td>
      <td>R$ ${l.valor.toLocaleString('pt-BR')}</td>
      <td style="color:var(--muted)">${escHtml(l.ultima)}</td>
    </tr>`).join('');
}
function abrirLead(id){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  alert('Ficha do lead: '+l.nome+'\n\nEm breve abriremos a ficha completa (histórico, qualificação, agendar contato, finalizar).');
}
